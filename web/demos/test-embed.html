<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embed Tester</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #f0f0f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 13px;
    color: #333;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  h1 { font-size: 16px; font-weight: 600; color: #111; }
  p  { color: #666; font-size: 12px; }

  .controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
  }

  .controls label { font-size: 12px; color: #555; }

  .controls input[type="number"] {
    width: 72px;
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 13px;
    outline: none;
  }
  .controls input[type="number"]:focus { border-color: #4a9eff; }

  .controls button {
    padding: 5px 14px;
    background: #4a9eff;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .controls button:hover { background: #2d84f0; }

  .frame-wrap {
    border: 2px dashed #bbb;
    border-radius: 6px;
    background: #fff;
    display: inline-block; /* shrink-wrap to iframe size */
    line-height: 0;        /* no extra gap below iframe */
  }

  iframe {
    display: block;
    border: none;
  }

  .url-display {
    font-size: 11px;
    color: #888;
    font-family: monospace;
    background: #f7f7f7;
    border: 1px solid #e0e0e0;
    border-radius: 5px;
    padding: 5px 10px;
    word-break: break-all;
  }
</style>
</head>
<body>

<h1>embed_interactive_frft.html — iframe tester</h1>
<p>Adjust width / height and hit Apply to reload the embed with matching <code>?w=&amp;h=</code> params.</p>

<div class="controls">
  <label>Width</label>
  <input type="number" id="wInput" value="600" min="200" step="10">
  <label>Height</label>
  <input type="number" id="hInput" value="220" min="100" step="10">
  <button id="applyBtn">Apply</button>
</div>

<div class="url-display" id="urlDisplay"></div>

<div class="frame-wrap" id="frameWrap">
  <iframe id="embedFrame" width="600" height="220"></iframe>
</div>

<hr style="border:none;border-top:1px solid #ccc;margin:8px 0;">

<h1>embed_non_interactive_frft.html — iframe tester</h1>
<p>Params are passed via URL. Hit Apply to reload.</p>

<div class="controls">
  <label>Width</label>
  <input type="number" id="wInput2" value="400" min="200" step="10">
  <label>Height</label>
  <input type="number" id="hInput2" value="220" min="100" step="10">
  <label>Type</label>
  <select id="typeInput">
    <option value="sweep" selected>sweep</option>
    <option value="sine">sine</option>
  </select>
  <label>Dur (s)</label>
  <input type="number" id="durInput" value="10" min="1" max="600" step="1">
  <label>Freq (Hz)</label>
  <input type="number" id="freqInput" value="440" min="20" max="20000" step="1">
  <label>α</label>
  <input type="number" id="alphaInput" value="0.10" min="0" max="4" step="0.00001">
  <label>Block</label>
  <input type="text" id="blocksizeInput" value="16384" style="width:72px;border:1px solid #ccc;border-radius:5px;padding:4px 7px;font-size:13px;outline:none;">
  <label>Overlap</label>
  <input type="number" id="overlapInput" value="4" min="1" max="32" step="1">
  <label>Half-spec</label>
  <select id="halfspecInput">
    <option value="0">No</option>
    <option value="1">Yes</option>
  </select>
  <button id="applyBtn2">Apply</button>
</div>

<div class="url-display" id="urlDisplay2"></div>

<div class="frame-wrap" id="frameWrap2">
  <iframe id="embedFrame2" width="400" height="220"></iframe>
</div>

<script>
  const wInput    = document.getElementById('wInput');
  const hInput    = document.getElementById('hInput');
  const applyBtn  = document.getElementById('applyBtn');
  const frame     = document.getElementById('embedFrame');
  const urlDisplay = document.getElementById('urlDisplay');

  function apply() {
    const w = Math.max(200, parseInt(wInput.value) || 600);
    const h = Math.max(100, parseInt(hInput.value) || 220);
    wInput.value = w;
    hInput.value = h;
    const url = `embed_interactive_frft.html?w=${w}&h=${h}&v=${Date.now()}`;
    frame.width  = w;
    frame.height = h;
    frame.src    = url;
    urlDisplay.textContent = location.origin + location.pathname.replace('test-embed.html', '') + url;
  }

  applyBtn.addEventListener('click', apply);
  [wInput, hInput].forEach(el => el.addEventListener('keydown', e => {
    if (e.key === 'Enter') apply();
  }));
  apply();

  // ── Non-interactive tester ────────────────────────────────────────────────
  const wInput2       = document.getElementById('wInput2');
  const hInput2       = document.getElementById('hInput2');
  const typeInput     = document.getElementById('typeInput');
  const durInput      = document.getElementById('durInput');
  const freqInput     = document.getElementById('freqInput');
  const alphaInput    = document.getElementById('alphaInput');
  const blocksizeInput = document.getElementById('blocksizeInput');
  const overlapInput   = document.getElementById('overlapInput');
  const halfspecInput  = document.getElementById('halfspecInput');
  const applyBtn2      = document.getElementById('applyBtn2');
  const frame2        = document.getElementById('embedFrame2');
  const urlDisplay2   = document.getElementById('urlDisplay2');

  function apply2() {
    const w = Math.max(200, parseInt(wInput2.value) || 600);
    const h = Math.max(100, parseInt(hInput2.value) || 160);
    wInput2.value = w;
    hInput2.value = h;
    const params = new URLSearchParams({
      w, h,
      type:      typeInput.value,
      dur:       durInput.value,
      freq:      freqInput.value,
      alpha:     alphaInput.value,
      blocksize: blocksizeInput.value,
      overlap:   overlapInput.value,
      halfspec:  halfspecInput.value,
      v:         Date.now(),
    });
    const url = `embed_non_interactive_frft.html?${params}`;
    frame2.width  = w;
    frame2.height = h;
    frame2.src    = url;
    urlDisplay2.textContent = location.origin + location.pathname.replace('test-embed.html', '') + url;
  }

  applyBtn2.addEventListener('click', apply2);
  [wInput2, hInput2, durInput, freqInput, alphaInput, overlapInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') apply2(); })
  );
  apply2();
</script>
</body>
</html>
